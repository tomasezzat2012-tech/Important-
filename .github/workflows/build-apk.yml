name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK platform and build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Unpack project from ZIP
        run: |
          unzip -q LawyerDiary-Android-Source.zip -d project
          cp google-services.json project/app/google-services.json

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: project
        run: |
          set -o pipefail
          gradle assembleRelease -Pvc=${{ github.run_number }} -Pvn=1.${{ github.run_number }} --console=plain 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        working-directory: project
        run: |
          grep -E "^e: " build.log | head -60 || true

      - name: Prepare release files
        env:
          MSG: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
        run: |
          cp project/app/build/outputs/apk/release/app-release.apk LawyerDiary.apk
          if [ -z "$MSG" ]; then MSG="تحديث جديد"; fi
          printf '%s' "$MSG" > notes.txt
          jq -n --argjson vc "${{ github.run_number }}" --arg vn "1.${{ github.run_number }}" --arg apk "https://github.com/$REPO/releases/latest/download/LawyerDiary.apk" --rawfile notes notes.txt '{versionCode:$vc,versionName:$vn,apk:$apk,notes:$notes}' > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: LawyerDiary-apk
          path: LawyerDiary.apk

      - name: Publish release (download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: مفكرة المحامي 1.${{ github.run_number }}
          body_path: notes.txt
          files: |
            LawyerDiary.apk
            version.json
